# ConfiguraÃ§Ã£o do datasource
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:mercado-dominio;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
quarkus.datasource.username=sa
quarkus.datasource.password=sa
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
quarkus.hibernate-orm.packages=org.mercadodominio.models.entities
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.http.port=8080
quarkus.http.root-path=/
quarkus.hibernate-orm.log.sql=true

# ConfiguraÃ§Ã£o do OpenAPI
quarkus.smallrye-openapi.path=/mercado-dominio
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.theme=original

# Configurações do cache para idempotência
quarkus.cache.caffeine."idempotency-cache".initial-capacity=100
quarkus.cache.caffeine."idempotency-cache".maximum-size=1000
quarkus.cache.caffeine."idempotency-cache".expire-after-write=PT1H

quarkus.api-key.value=sua-api-key-secreta
quarkus.api-key.header-name=X-API-Key

# Configurar rate limit para classes específicas
# Formato: quarkus.fault-tolerance.[identificador].rate-limit.[propriedade]=[valor]

# Habilitar métricas para monitoramento
quarkus.smallrye-metrics.jaxrs.enabled=true

# Taxa de limite global para o serviço de produtos (sobrescreve a anotação)
org.acme.controller.ProdutoResource/listarProdutos.RateLimit/value=30
org.acme.controller.ProdutoResource/listarProdutos.RateLimit/windowDuration=1

# Configurações diferentes por ambiente (desenvolvimento vs produção)
%dev.org.acme.controller.ProdutoResource/listarProdutos.RateLimit/value=50
%prod.org.acme.controller.ProdutoResource/listarProdutos.RateLimit/value=20